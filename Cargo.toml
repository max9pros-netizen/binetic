[workspace]
members = [
    "binetic-core",
    "binetic-intent",
    "binetic-llama-cpp",
    "binetic-mlx",
    "binetic-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Binetic: self-describing, spatially-organized computation fabric for local AI inference"
repository = "https://github.com/binetic/binetic"
keywords = ["inference", "memory", "fabric", "llama", "mlx", "xor", "kv-cache"]
categories = ["cryptography", "science", "hardware-support"]

[workspace.dependencies]
binetic-core = { path = "binetic-core" }

# 용산 dependencies
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
mmap = "0.1"
polling = "2"
crossbeam = "0.8"
parking_lot = "0.12"
once_cell = "1"
hmac = "0.12"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
