[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "binetic-runtime"
version = "0.1.0"
description = "Temporal computing runtime: declare a .tpn protocol and run it — simulate, synthesize, deploy"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["temporal", "tpn", "fpga", "trig-gate", "time-as-primitive"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
binetic = "binetic_runtime:main"

[tool.setuptools.packages.find]
where = ["."]
