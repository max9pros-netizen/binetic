[package]
name = "binetic-cli"
version.workspace = true
edition.workspace = true

[dependencies]
binetic-core = { path = "../binetic-core" }
binetic-intent = { path = "../binetic-intent" }
binetic-llama-cpp = { path = "../binetic-llama-cpp" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2"
indicatif = "0.17"
dirs = "5"
toml = "0.8"
